services:
  postgres:
    image: postgres:16-alpine
    container_name: rmp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-release_management}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-release_management}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rmp-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: rmp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-release_management}?schema=public
      CORS_ORIGIN: http://localhost:5173
      GRAPHQL_PATH: /graphql
      GRAPHQL_PLAYGROUND: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rmp-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: rmp-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api
    networks:
      - rmp-network

volumes:
  postgres_data:
    driver: local

networks:
  rmp-network:
    driver: bridge
